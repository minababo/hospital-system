{# Lab order status colours. Expects `order`. #}
<span class="badge {% if order.status == 'REQUESTED' %}badge-info{% elif order.status == 'SAMPLE_COLLECTED' %}badge-warning{% elif order.status == 'COMPLETED' %}badge-success{% else %}badge-neutral line-through{% endif %}">{{ order.get_status_display }}</span>
{% if order.priority == "URGENT" %}<span class="badge badge-danger ml-1">Urgent</span>{% endif %}
