{# Orderable tests as checkboxes grouped by section. Expects `tests_by_section`, optional `selected`. #}
{% load money %}
<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
  {% for section, tests in tests_by_section %}
    <fieldset class="rounded-md border border-slate-200 p-3">
      <legend class="px-1 text-xs font-semibold text-slate-500 uppercase">{{ section }}</legend>
      {% for test in tests %}
        <label class="flex items-start gap-2 py-1 text-sm">
          <input type="checkbox" name="tests" value="{{ test.pk }}" class="mt-1" {% if test.pk|stringformat:"s" in selected %}checked{% endif %}>
          <span>{{ test.name }} <span class="font-mono text-xs text-slate-500">{{ test.code }}</span><span class="block text-xs text-slate-500">{{ test.price|rupees }}</span></span>
        </label>
      {% endfor %}
    </fieldset>
  {% empty %}
    <p class="text-sm text-slate-500">No tests are set up in the catalog yet.</p>
  {% endfor %}
</div>
