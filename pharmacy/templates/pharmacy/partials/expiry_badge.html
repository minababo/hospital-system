{# Expiry date with a badge. Expects `batch`, `today` and `expiry_warning_until` (a date). #}
{{ batch.expiry_date|date:"d M Y" }}
{% if batch.expiry_date < today %}<span class="badge badge-danger ml-1">Expired</span>
{% elif batch.expiry_date <= expiry_warning_until %}<span class="badge badge-warning ml-1">Expiring soon</span>{% endif %}
