{% extends "layouts/app.html" %}

{% block title %}Change password{% endblock %}

{% block content %}
  <h1 class="text-2xl font-semibold text-slate-900">Change password</h1>

  <form method="post" class="mt-6 max-w-md space-y-4 rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    {% csrf_token %}
    {% include "partials/form_errors.html" %}
    {% for field in form %}
      {% include "partials/form_field.html" %}
    {% endfor %}
    <button type="submit" class="rounded-md bg-slate-800 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700">Change password</button>
  </form>
{% endblock %}
