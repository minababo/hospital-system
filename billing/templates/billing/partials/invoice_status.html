{# One place for invoice status colours. Expects `status` and `label`. #}
<span class="badge {% if status == 'DRAFT' %}badge-neutral{% elif status == 'ISSUED' %}badge-info{% elif status == 'PARTIALLY_PAID' %}badge-warning{% elif status == 'PAID' %}badge-success{% elif status == 'VOID' %}badge-danger line-through{% else %}badge-neutral{% endif %}">{{ label }}</span>
