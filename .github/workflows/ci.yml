name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hms_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      SECRET_KEY: ci-only-not-a-real-secret-key-0123456789-abcdefghijklmnop
      DEBUG: "False"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hms_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django deployment checks
        run: python manage.py check --deploy --fail-level WARNING

      # The stylesheet is compiled and committed (Render doesn't build it). Rebuild it here
      # with the pinned Tailwind CLI and fail if the committed file is out of date.
      - name: Cache the Tailwind CLI
        uses: actions/cache@v6
        with:
          path: tools
          key: tailwindcss-${{ runner.os }}-${{ hashFiles('scripts/build_css.sh') }}

      - name: Verify compiled CSS is up to date
        run: |
          bash scripts/build_css.sh
          if ! git diff --exit-code -- static/css/app.css; then
            echo "::error file=static/css/app.css::static/css/app.css is out of date. Run scripts/build_css.sh and commit static/css/app.css."
            exit 1
          fi

      - name: Run tests
        run: python -m pytest
