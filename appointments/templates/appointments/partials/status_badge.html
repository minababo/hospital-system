{# One place for status colours, used by the list, detail, calendar and patient pages. #}
<span class="badge {% if status == 'BOOKED' %}badge-info{% elif status == 'CHECKED_IN' %}badge-warning{% elif status == 'COMPLETED' %}badge-success{% elif status == 'CANCELLED' %}badge-neutral line-through{% elif status == 'NO_SHOW' %}badge-danger{% else %}badge-neutral{% endif %}">{{ label }}</span>
