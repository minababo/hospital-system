{# Status buttons for one appointment. `actions` comes from views.allowed_actions(). #}
<div class="flex flex-wrap justify-end gap-2 whitespace-nowrap">
  {% if "check_in" in actions %}
    <form method="post" action="{% url 'appointments:check_in' appointment.pk %}">
      {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
      <button type="submit" class="btn btn-primary btn-sm">Check in</button>
    </form>
  {% endif %}
  {% if "no_show" in actions %}
    <form method="post" action="{% url 'appointments:no_show' appointment.pk %}" onsubmit="return confirm('Mark this appointment as a no-show?');">
      {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
      <button type="submit" class="btn btn-secondary btn-sm">No-show</button>
    </form>
  {% endif %}
</div>
