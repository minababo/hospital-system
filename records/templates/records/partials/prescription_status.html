{# Prescription status badge. Expects `prescription`. #}
<span class="badge {% if prescription.status == 'DRAFT' %}badge-neutral{% elif prescription.status == 'ISSUED' %}badge-info{% elif prescription.status == 'PARTIALLY_DISPENSED' %}badge-warning{% elif prescription.status == 'DISPENSED' %}badge-success{% else %}badge-danger line-through{% endif %}">{{ prescription.get_status_display }}</span>
