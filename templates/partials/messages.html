{# Django messages as alerts, coloured by level. The dismiss button only appears with JavaScript. #}
{% if messages %}
  <div class="mb-6 space-y-2">
    {% for message in messages %}
      <div role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}"
           class="alert flex items-start gap-3 {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'success' %}alert-success{% elif message.tags == 'warning' %}alert-warning{% else %}alert-info{% endif %}">
        <p class="flex-1">{{ message }}</p>
        <button type="button" class="-my-1 -mr-2 rounded p-1 opacity-70 hover:opacity-100" data-dismiss hidden aria-label="Dismiss">
          {% include "partials/icon.html" with name="x-mark" class="size-4" %}
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}
