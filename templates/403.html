{% extends "layouts/centered.html" %}

{% block title %}Access denied{% endblock %}

{% block content %}
  <div class="text-center">
    <p class="text-sm font-semibold text-slate-500">403</p>
    <h1 class="mt-2 text-2xl font-semibold text-slate-900">Access denied</h1>
    <p class="mt-3 text-slate-600">Your role does not have permission to view this page.</p>
    {% if user.is_authenticated %}
      <a href="{% url 'dashboard' %}" class="btn btn-primary mt-6">Back to dashboard</a>
    {% else %}
      <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-6">Log in</a>
    {% endif %}
  </div>
{% endblock %}
