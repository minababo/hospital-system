<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Print{% endblock %} | Hospital Management System</title>
  {# A plain layout for paper: no sidebar, no Tailwind, black on white. #}
  <style>
    body { font-family: system-ui, sans-serif; color: #111; margin: 2rem auto; max-width: 48rem; padding: 0 1rem; font-size: 14px; }
    header { border-bottom: 2px solid #111; padding-bottom: .5rem; margin-bottom: 1rem; }
    header h1 { margin: 0; font-size: 1.25rem; }
    h2 { font-size: 1rem; margin: 1.25rem 0 .4rem; border-bottom: 1px solid #ccc; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .3rem .4rem; border-bottom: 1px solid #ddd; vertical-align: top; }
    .muted { color: #555; }
    .num { text-align: right; white-space: nowrap; }
    .allergy { border: 1px solid #b91c1c; padding: .4rem; font-weight: 600; }
    .print-button { padding: .4rem .9rem; margin-bottom: 1rem; }
    /* The print button is for the screen only. */
    @media print { .print-button { display: none; } body { margin: 0; } }
  </style>
</head>
<body>
  <button type="button" class="print-button" onclick="window.print()">Print</button>
  <header>
    <h1>Hospital Management System</h1>
    <div class="muted">{% block heading %}{% endblock %}</div>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
