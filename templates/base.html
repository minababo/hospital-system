<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HMS{% endblock %} | Hospital Management System</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @layer base {
      input[type="text"], input[type="email"], input[type="password"], input[type="search"],
      input[type="date"], input[type="time"], input[type="number"], input[type="tel"], select, textarea {
        @apply w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm focus:border-slate-500 focus:ring-1 focus:ring-slate-500 focus:outline-none;
      }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  {% block body %}{% endblock %}
</body>
</html>
