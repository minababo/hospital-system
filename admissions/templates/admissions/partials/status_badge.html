{# Admission status badge. Expects `admission`. #}
{% if admission.status == "ADMITTED" %}<span class="rounded-full bg-blue-50 px-2 py-0.5 text-xs font-medium text-blue-700">Admitted</span>
{% else %}<span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-600">Discharged</span>{% endif %}
