{# Rendered by {% appointment_admit_action appointment user %} on the appointment page. #}
{% if current %}
  <a href="{% url 'admissions:admission_detail' current.pk %}" class="btn btn-secondary btn-sm">Currently admitted — {{ current.number }}</a>
{% elif can_admit %}
  <a href="{% url 'admissions:admit' %}?patient={{ appointment.patient_id }}&appointment={{ appointment.pk }}" class="btn btn-secondary btn-sm">Admit patient</a>
{% endif %}
